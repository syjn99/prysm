# 6 nodes generate proofs, 2 nodes only verify
participants:
  # Proof generating nodes (nodes 1-6)
  - el_type: geth
    el_image: ethereum/client-go:latest
    cl_type: prysm
    cl_image: prysm-bn-custom-image
    vc_image: prysm-vc-custom-image
    count: 6
  # Proof verifying only node (node 7, 8)
  - el_type: dummy
    cl_type: prysm
    cl_image: prysm-bn-custom-image
    cl_extra_params:
      - --activate-zkvm
    vc_image: prysm-vc-custom-image
    count: 2
network_params:
  seconds_per_slot: 2
global_log_level: debug
snooper_enabled: false
additional_services:
  - dora
  - prometheus_grafana
