syntax = "proto3";

package ethereum.eth.v1alpha1;

import "proto/engine/v1/execution_engine.proto";
import "proto/engine/v1/gloas.proto";
import "proto/eth/ext/options.proto";
import "proto/prysm/v1alpha1/attestation.proto";
import "proto/prysm/v1alpha1/withdrawals.proto";
import "proto/prysm/v1alpha1/beacon_core_types.proto";
import "proto/prysm/v1alpha1/eip_7251.proto";
import "proto/prysm/v1alpha1/gloas.proto";

option go_package = "github.com/OffchainLabs/prysm/v7/proto/prysm/v1alpha1;eth";

// =============================================================================
// Heze Fork Specification
// =============================================================================
// This file implements the Heze fork of the Ethereum consensus specification
// Reference:
// https://github.com/ethereum/consensus-specs/blob/master/specs/heze/beacon-chain.md

// ExecutionPayloadBidHeze represents an execution payload bid in the Heze fork.
//
// Spec:
// class ExecutionPayloadBid(ProgressiveContainer):
//     parent_block_hash: Hash32
//     parent_block_root: Root
//     block_hash: Hash32
//     prev_randao: Bytes32
//     fee_recipient: ExecutionAddress
//     gas_limit: uint64
//     builder_index: BuilderIndex
//     slot: Slot
//     value: Gwei
//     execution_payment: Gwei
//     blob_kzg_commitments: BlobKZGCommitments
//     execution_requests_root: Root
//     # [New in Heze:EIP7805]
//     inclusion_list_bits: InclusionListBits
message ExecutionPayloadBidHeze {
  bytes parent_block_hash = 1 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes parent_block_root = 2 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes block_hash = 3 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes prev_randao = 4 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes fee_recipient = 5 [ (ethereum.eth.ext.ssz_size) = "20" ];
  uint64 gas_limit = 6;
  uint64 builder_index = 7 [ (ethereum.eth.ext.cast_type) =
                                 "github.com/OffchainLabs/prysm/v7/"
                                 "consensus-types/primitives.BuilderIndex" ];
  uint64 slot = 8 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  uint64 value = 9 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  uint64 execution_payment = 10 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  repeated bytes blob_kzg_commitments = 11 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];
  bytes execution_requests_root = 12 [ (ethereum.eth.ext.ssz_size) = "32" ];

  // New in Heze
  bytes inclusion_list_bits = 13
      [ (ethereum.eth.ext.ssz_size) = "inclusion_list_bits.size" ];
}

// SignedExecutionPayloadBidHeze wraps a Heze execution payload bid with a
// signature.
//
// Spec:
// class SignedExecutionPayloadBid(Container):
//     # [Modified in Heze:EIP7805]
//     message: ExecutionPayloadBid
//     signature: BLSSignature
message SignedExecutionPayloadBidHeze {
  ExecutionPayloadBidHeze message = 1;
  bytes signature = 2 [ (ethereum.eth.ext.ssz_size) = "96" ];
}

// InclusionList is the list of transactions an inclusion list committee member
// requires the next payload to include.
//
// Spec:
// class InclusionList(Container):
//     slot: Slot
//     validator_index: ValidatorIndex
//     dependent_root: Root
//     transactions: Transactions
message InclusionList {
  uint64 slot = 1 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  uint64 validator_index = 2
      [ (ethereum.eth.ext.cast_type) =
            "github.com/OffchainLabs/prysm/v7/consensus-types/"
            "primitives.ValidatorIndex" ];
  bytes dependent_root = 3 [ (ethereum.eth.ext.ssz_size) = "32" ];
  repeated bytes transactions = 4 [
    (ethereum.eth.ext.ssz_size) = "?,?",
    (ethereum.eth.ext.ssz_max) = "1048576,1073741824"
  ];
}

// SignedInclusionList wraps an inclusion list with the committee member's
// signature.
//
// Spec:
// class SignedInclusionList(Container):
//     message: InclusionList
//     signature: BLSSignature
message SignedInclusionList {
  InclusionList message = 1;
  bytes signature = 2 [ (ethereum.eth.ext.ssz_size) = "96" ];
}

// BeaconBlockHeze represents a beacon block in the Heze fork.
message BeaconBlockHeze {
  uint64 slot = 1 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  uint64 proposer_index = 2 [ (ethereum.eth.ext.cast_type) =
                                  "github.com/OffchainLabs/prysm/v7/"
                                  "consensus-types/primitives.ValidatorIndex" ];
  bytes parent_root = 3 [ (ethereum.eth.ext.ssz_size) = "32" ];
  bytes state_root = 4 [ (ethereum.eth.ext.ssz_size) = "32" ];
  BeaconBlockBodyHeze body = 5;
}

// BeaconBlockBodyHeze represents the body of a beacon block in the Heze fork.
// Identical to Gloas except signed_execution_payload_bid gains the Heze bid.
message BeaconBlockBodyHeze {
  bytes randao_reveal = 1 [ (ethereum.eth.ext.ssz_size) = "96" ];
  Eth1Data eth1_data = 2;
  bytes graffiti = 3 [ (ethereum.eth.ext.ssz_size) = "32" ];
  repeated ProposerSlashing proposer_slashings = 4
      [ (ethereum.eth.ext.ssz_max) = "16" ];
  repeated AttesterSlashingGloas attester_slashings = 5
      [ (ethereum.eth.ext.ssz_max) = "1" ];
  repeated AttestationGloas attestations = 6
      [ (ethereum.eth.ext.ssz_max) = "8" ];
  repeated Deposit deposits = 7 [ (ethereum.eth.ext.ssz_max) = "16" ];
  repeated SignedVoluntaryExit voluntary_exits = 8
      [ (ethereum.eth.ext.ssz_max) = "16" ];
  SyncAggregate sync_aggregate = 9;
  repeated SignedBLSToExecutionChange bls_to_execution_changes = 10
      [ (ethereum.eth.ext.ssz_max) = "16" ];

  // Modified in Heze
  SignedExecutionPayloadBidHeze signed_execution_payload_bid = 11;
  repeated PayloadAttestation payload_attestations = 12
      [ (ethereum.eth.ext.ssz_max) = "payload_attestation.size" ];
  ethereum.engine.v1.ExecutionRequestsGloas parent_execution_requests = 13;
}

// SignedBeaconBlockHeze represents a signed beacon block in the Heze fork.
message SignedBeaconBlockHeze {
  BeaconBlockHeze block = 1;
  bytes signature = 2 [ (ethereum.eth.ext.ssz_size) = "96" ];
}

// BeaconBlockContentsHeze bundles a Heze beacon block with the execution
// payload envelope and associated blob data.
message BeaconBlockContentsHeze {
  BeaconBlockHeze block = 1;
  ExecutionPayloadEnvelope execution_payload_envelope = 2;
  repeated bytes kzg_proofs = 3 [
    (ethereum.eth.ext.ssz_size) = "?,48",
    (ethereum.eth.ext.ssz_max) = "max_cell_proofs_length.size"
  ];
  repeated bytes blobs = 4 [
    (ethereum.eth.ext.ssz_size) = "?,blob.size",
    (ethereum.eth.ext.ssz_max) = "max_blob_commitments.size"
  ];
}

// BeaconStateHeze represents the beacon state in the Heze fork.
// Identical to Gloas except latest_execution_payload_bid gains the Heze bid.
message BeaconStateHeze {
  // Versioning [1001-2000]
  uint64 genesis_time = 1001;
  bytes genesis_validators_root = 1002 [ (ethereum.eth.ext.ssz_size) = "32" ];
  uint64 slot = 1003 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Slot"
  ];
  Fork fork = 1004;

  // History [2001-3000]
  BeaconBlockHeader latest_block_header = 2001;
  repeated bytes block_roots = 2002
      [ (ethereum.eth.ext.ssz_size) = "block_roots.size" ];
  repeated bytes state_roots = 2003
      [ (ethereum.eth.ext.ssz_size) = "state_roots.size" ];
  repeated bytes historical_roots = 2004 [
    (ethereum.eth.ext.ssz_size) = "?,32",
    (ethereum.eth.ext.ssz_max) = "16777216"
  ];

  // Eth1 [3001-4000]
  Eth1Data eth1_data = 3001;
  repeated Eth1Data eth1_data_votes = 3002
      [ (ethereum.eth.ext.ssz_max) = "eth1_data_votes.size" ];
  uint64 eth1_deposit_index = 3003;

  // Registry [4001-5000]
  repeated Validator validators = 4001
      [ (ethereum.eth.ext.ssz_max) = "1099511627776" ];
  repeated uint64 balances = 4002
      [ (ethereum.eth.ext.ssz_max) = "1099511627776" ];

  // Randomness [5001-6000]
  repeated bytes randao_mixes = 5001
      [ (ethereum.eth.ext.ssz_size) = "randao_mixes.size" ];

  // Slashings [6001-7000]
  repeated uint64 slashings = 6001
      [ (ethereum.eth.ext.ssz_size) = "slashings.size" ];

  // Participation [7001-8000]
  bytes previous_epoch_participation = 7001
      [ (ethereum.eth.ext.ssz_max) = "1099511627776" ];
  bytes current_epoch_participation = 7002
      [ (ethereum.eth.ext.ssz_max) = "1099511627776" ];

  // Finality [8001-9000]
  bytes justification_bits = 8001 [
    (ethereum.eth.ext.ssz_size) = "1",
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/go-bitfield.Bitvector4"
  ];
  Checkpoint previous_justified_checkpoint = 8002;
  Checkpoint current_justified_checkpoint = 8003;
  Checkpoint finalized_checkpoint = 8004;

  // Fields introduced in Altair fork [9001-10000]
  repeated uint64 inactivity_scores = 9001
      [ (ethereum.eth.ext.ssz_max) = "1099511627776" ];
  SyncCommittee current_sync_committee = 9002;
  SyncCommittee next_sync_committee = 9003;

  // Note: latest_execution_payload_header replaced with latest_block_hash in
  // Gloas
  bytes latest_block_hash = 10001 [ (ethereum.eth.ext.ssz_size) = "32" ];

  // Fields introduced in Capella fork [11001-12000]
  uint64 next_withdrawal_index = 11001;
  uint64 next_withdrawal_validator_index = 11002
      [ (ethereum.eth.ext.cast_type) =
            "github.com/OffchainLabs/prysm/v7/consensus-types/"
            "primitives.ValidatorIndex" ];
  repeated HistoricalSummary historical_summaries = 11003
      [ (ethereum.eth.ext.ssz_max) = "16777216" ];

  // Fields introduced in Electra fork [12001-13000]
  uint64 deposit_requests_start_index = 12001;
  uint64 deposit_balance_to_consume = 12002 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  uint64 exit_balance_to_consume = 12003 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  uint64 earliest_exit_epoch = 12004 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Epoch"
  ];
  uint64 consolidation_balance_to_consume = 12005 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Gwei"
  ];
  uint64 earliest_consolidation_epoch = 12006 [
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/primitives.Epoch"
  ];
  repeated PendingDeposit pending_deposits = 12007
      [ (ethereum.eth.ext.ssz_max) = "pending_deposits_limit" ];
  repeated PendingPartialWithdrawal pending_partial_withdrawals = 12008
      [ (ethereum.eth.ext.ssz_max) = "pending_partial_withdrawals_limit" ];
  repeated PendingConsolidation pending_consolidations = 12009
      [ (ethereum.eth.ext.ssz_max) = "pending_consolidations_limit" ];

  // Fields introduced in Fulu fork [13001-14000]
  repeated uint64 proposer_lookahead = 13001 [
    (ethereum.eth.ext.ssz_size) = "proposer_lookahead_size",
    (ethereum.eth.ext.cast_type) =
        "github.com/OffchainLabs/prysm/v7/consensus-types/"
        "primitives.ValidatorIndex"
  ];

  // Fields introduced in Gloas fork [14001-15000]
  repeated Builder builders = 14001
      [ (ethereum.eth.ext.ssz_max) = "builder_registry_limit" ];
  uint64 next_withdrawal_builder_index = 14002
      [ (ethereum.eth.ext.cast_type) =
            "github.com/OffchainLabs/prysm/v7/consensus-types/"
            "primitives.BuilderIndex" ];
  bytes execution_payload_availability = 14003
      [ (ethereum.eth.ext.ssz_size) = "execution_payload_availability.size" ];
  repeated BuilderPendingPayment builder_pending_payments = 14004
      [ (ethereum.eth.ext.ssz_size) = "builder_pending_payments.size" ];
  repeated BuilderPendingWithdrawal builder_pending_withdrawals = 14005
      [ (ethereum.eth.ext.ssz_max) = "1048576" ];
  // Modified in Heze
  ExecutionPayloadBidHeze latest_execution_payload_bid = 14006;
  repeated ethereum.engine.v1.Withdrawal payload_expected_withdrawals = 14007
      [ (ethereum.eth.ext.ssz_max) = "withdrawal.size" ];
  repeated PTCs ptc_window = 14008
      [ (ethereum.eth.ext.ssz_size) = "ptc_window.size" ];
}
